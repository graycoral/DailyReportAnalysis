name: Build Windows application
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check catalog and Outlook UI
        shell: pwsh
        run: |
          node --check internal/hub/web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax check failed' }
          node scripts/check-catalog-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Catalog visibility UI tests failed' }
          node scripts/check-outlook-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Outlook path UI tests failed' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test report publication rules
        run: python -I scripts/check-import-history.py
      - name: Test release retry and verification
        shell: pwsh
        run: node scripts/check-release.cjs
      - name: Test and build self-contained executables
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AVReportHub-Windows-x64
          path: dist/*
          retention-days: 30
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AVReportHub-Windows-x64
          path: dist
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs
