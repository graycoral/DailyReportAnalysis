name: Build Windows application
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build offline note editor
        shell: pwsh
        run: |
          npm ci --no-fund --no-audit
          if ($LASTEXITCODE -ne 0) { throw 'Note editor dependencies failed' }
          npm run build:notes
          if ($LASTEXITCODE -ne 0) { throw 'Note editor bundle failed' }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check catalog, local and multimodal UI
        shell: pwsh
        run: |
          node --check internal/hub/web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax check failed' }
          node --check internal/hub/web/map-view.js
          if ($LASTEXITCODE -ne 0) { throw 'Map viewport syntax check failed' }
          node --check internal/hub/web/connections.js
          if ($LASTEXITCODE -ne 0) { throw 'Offline connections syntax check failed' }
          node scripts/check-connections-model.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Offline connections UI model tests failed' }
          node --check internal/hub/web/github-choice.js
          if ($LASTEXITCODE -ne 0) { throw 'First-run GitHub choice syntax check failed' }
          node scripts/check-catalog-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Catalog visibility UI tests failed' }
          node scripts/check-rag-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'RAG setup UI tests failed' }
          node scripts/check-rag-media-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'RAG media/map UI tests failed' }
          node scripts/check-outlook-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Outlook path UI tests failed' }
          node scripts/check-import-model.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Local report import UI tests failed' }
          node scripts/check-source-layers.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Map source visibility tests failed' }
          node scripts/check-note-network.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Note link extraction tests failed' }
          node scripts/check-note-listing.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Incremental note listing tests failed' }
          node scripts/check-map-model.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Map identity and source-link tests failed' }
      - name: Test release retry and verification
        shell: pwsh
        run: node scripts/check-release.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test report publication rules
        run: python -I scripts/check-import-history.py
      - name: Test optional media service without downloading a model
        shell: pwsh
        run: |
          python -m pip install numpy pillow pillow-heif pypdfium2
          if ($LASTEXITCODE -ne 0) { throw 'Media test dependencies failed' }
          python -m unittest discover -s rag -p test_media.py
          if ($LASTEXITCODE -ne 0) { throw 'Media service tests failed' }
          python -m unittest discover -s rag -p test_efficiency.py
          if ($LASTEXITCODE -ne 0) { throw 'Background task and model scheduling tests failed' }
      - name: Test and build self-contained executables
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test offline workflows in Edge
        shell: pwsh
        env:
          AV_NAV_VIEWER: dist/AVReportHub.exe
          AV_NOTES_VIEWER: dist/AVReportHub.exe
        run: |
          foreach ($check in @('connections-ui', 'github-choice-ui', 'github-catalog-ui', 'notes-ui', 'notes-performance-ui', 'note-network-ui', 'report-reading-ui', 'hallmark-ui', 'map-ui')) {
            node "scripts/check-$check.cjs"
            if ($LASTEXITCODE -ne 0) { throw "Offline browser test failed: $check" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AVReportHub-Windows-x64
          path: dist/*
          retention-days: 30
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AVReportHub-Windows-x64
          path: dist
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs
