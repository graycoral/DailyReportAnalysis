name: Build Windows application
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check catalog, local and multimodal UI
        shell: pwsh
        run: |
          node --check internal/hub/web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax check failed' }
          node scripts/check-catalog-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Catalog visibility UI tests failed' }
          node scripts/check-rag-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'RAG setup UI tests failed' }
          node scripts/check-rag-media-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'RAG media/map UI tests failed' }
          node scripts/check-outlook-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Outlook path UI tests failed' }
          node scripts/check-import-model.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Local report import UI tests failed' }
          node scripts/check-source-layers.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Map source visibility tests failed' }
          node scripts/check-map-model.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Map identity and source-link tests failed' }
      - name: Test release retry and verification
        shell: pwsh
        run: node scripts/check-release.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test report publication rules
        run: python -I scripts/check-import-history.py
      - name: Test optional media service without downloading a model
        shell: pwsh
        run: |
          python -m pip install numpy pillow pillow-heif pypdfium2
          if ($LASTEXITCODE -ne 0) { throw 'Media test dependencies failed' }
          python -m unittest discover -s rag -p test_media.py
          if ($LASTEXITCODE -ne 0) { throw 'Media service tests failed' }
          python -m unittest discover -s rag -p test_efficiency.py
          if ($LASTEXITCODE -ne 0) { throw 'Background task and model scheduling tests failed' }
      - name: Test and build self-contained executables
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test map selection in Edge
        shell: pwsh
        run: |
          npm install --prefix build/ui-tools --no-save --no-fund --no-audit playwright@1.55.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed' }
          $env:NODE_PATH = Join-Path $PWD 'build/ui-tools/node_modules'
          $env:AV_NAV_VIEWER = Join-Path $PWD 'dist/AVReportHub.exe'
          node scripts/check-map-ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Map browser tests failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AVReportHub-Windows-x64
          path: dist/*
          retention-days: 30
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AVReportHub-Windows-x64
          path: dist
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs
