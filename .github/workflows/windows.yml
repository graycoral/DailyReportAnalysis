name: Build Windows application
on:
  push:
    branches: [main]
    paths-ignore: ['data/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Test and build self-contained executables
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AVReportHub-Windows-x64
          path: dist/*
          retention-days: 30
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release tag follows the Version constant in internal/hub/model.go so code and release never drift.
          $ver = (Select-String -Path internal/hub/model.go -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match Version $ver" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "AV Report Hub $tag" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $tag dist/AVReportHub-Windows-x64.zip dist/AVReportHub-Setup.exe dist/AVReportHub.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
